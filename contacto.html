<!DOCTYPE html>

<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Visita Meridian</title>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <link rel="stylesheet"href="CSS/estilos.css" />
</head>
<body>
    <header>
        <img src="images/logo.jpg"alt="Emblema Carja"
             width="300"
             height="300" />
    </header>
    <main>
        <section id="contacto">
            <h2>Contactanos para descubrir Meridian</h2>
            <br />
            <form action="#"method="post">
            <label for="tribu">A que tribu Perteneces</label>
            <input type="text"name="tribu"id="tribu"required />
            <br />
            <br />
            <label for="nombre">Escriba su nombre</label>
            <input type="text"name="nombre"id="nombre"required />
            <br />
            <label for="edad">Ciclos vividos</label>
            <input type="number"name="edad"id="edad" />
            <br />
            <label for="Razon de visita">Razon de su visita</label>
            <select name="Razon de su visita"id="Razon de visita"required>
                <option value>Elegir una opcion</option>
                <option value>Comercio</option>
                <option value>Caza</option>
                <option value>Placer</option>
                <option value>Exploracion</option>
            </select>
                   <br />
            <button type="submit">Guardar</button>
            <p><strong>Advertencia:</strong>No se olvide de hacer click en "Guardar"</p>
             </form>
       
        </section>

    </main>
    <footer>
        <address>
            <p>Autor de pagina Dario Cela</p>
            <a href="mailto:dario_x_2009@hotmail.com">Contacto de email</a>
        </address>
    </footer>
</body>
</html>
